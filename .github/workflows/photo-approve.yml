name: Publish approved photo

# An admin approves a photo by adding the `photo-approved` label to an issue made with the
# "Photo" form. The photos are re-encoded (metadata stripped) and committed to the default
# branch, which redeploys the site. To reject, just close the issue.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: photos
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'photo-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Only maintainers can approve
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          echo "$SENDER has $perm"
          case "$perm" in admin|maintain|write) ;; *) echo "::error::$SENDER cannot approve photos"; exit 1;; esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Import photos
        id: import
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/photos/import.ts

      - run: npm run validate:content

      - name: Commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos content/photos.yaml
          git commit -m "Add photo from #$ISSUE_NUMBER"
          git push

      - name: Report back
        if: always() && steps.import.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OK: ${{ job.status == 'success' }}
        run: |
          [ -f photo-result.md ] || echo "Publishing failed – see the workflow log." > photo-result.md
          gh issue comment "$ISSUE_NUMBER" --body-file photo-result.md
          if [ "$OK" = "true" ]; then gh issue close "$ISSUE_NUMBER" --reason completed; fi
