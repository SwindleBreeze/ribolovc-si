- slug: soca-bovec
  name: { sl: Soča (Bovec), en: Soča river (Bovec), de: Soča (Bovec), it: Isonzo (Bovec) }
  type: river
  region: goriska
  water: Soča
  coords: [46.3330, 13.5480]
  parking: [46.3360, 13.5520]
  description:
    sl: Smaragdna Soča v Bovški kotlini – vrhunska muharska voda s soško postrvjo, šarenko in lipanom v divjem alpskem okolju.
    en: The emerald Soča in the Bovec basin – a world-class fly-fishing river with marble trout, rainbow trout and grayling in wild alpine scenery.
  access:
    sl: Parkirišča ob mostovih pri Čezsoči in Kršovcu; pazite na raftarje in kajakaše poleti.
    en: Parking by the bridges at Čezsoča and Kršovec; watch out for rafters and kayakers in summer.
  species: [soska-postrv, sarenka, lipan, potocna-postrv]
  techniques: [fly]
  club: { name: Ribiška družina Tolmin }
  permit:
    kind: ribiskekarte
    url: https://www.ribiskekarte.si
    note:
      sl: Dnevne in večdnevne dovolilnice za muharjenje.
      en: Day and multi-day fly-fishing permits.
  rules:
    flyOnly: true
    barbless: true
    notes:
      sl: Le muharjenje; omejitev ulova salmonidov, soška postrv večinoma ujemi in spusti.
      en: Fly fishing only; salmonid bag limits, marble trout mostly catch-and-release.
  season:
    sl: Običajno 1. april – 31. oktober.
    en: Usually 1 April – 31 October.
  beginnerFriendly: false
  difficulty: 3
  links:
    - { label: Visit Kanal – fishing, url: "https://www.visitkanal.si/en/sport-and-recreation/other-activities/fishing/" }
