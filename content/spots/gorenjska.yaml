- slug: sava-bohinjka
  name: { sl: Sava Bohinjka, en: Sava Bohinjka river, de: Sava Bohinjka, it: Sava Bohinjka }
  type: river
  region: gorenjska
  water: Sava Bohinjka
  coords: [46.2768, 13.9553]
  parking: [46.2760, 13.9540]
  description:
    sl: Kristalno čista alpska reka med Bohinjskim jezerom in Bledom, ena najbolj znanih muharskih voda v Evropi. Potočna postrv, šarenka, lipan in soška postrv.
    en: A crystal-clear alpine river between Lake Bohinj and Bled, one of Europe's best-known fly-fishing waters. Brown and rainbow trout, grayling and marble trout.
  access:
    sl: Dostop ob glavni cesti Bled–Bohinj; parkirišča v Bohinjski Bistrici in ob mostovih. Pazite na zasebna zemljišča.
    en: Access along the Bled–Bohinj road; parking in Bohinjska Bistrica and near bridges. Respect private land.
  species: [potocna-postrv, sarenka, lipan, soska-postrv]
  techniques: [fly]
  permit:
    kind: ribiskekarte
    url: https://www.ribiskekarte.si
    note:
      sl: Dnevne dovolilnice za muharjenje; na voljo tudi v lokalnih turističnih centrih.
      en: Day permits for fly fishing; also sold at local tourist offices.
  rules:
    flyOnly: true
    barbless: true
    notes:
      sl: Na delih revirja velja ujemi in spusti. Preverite ribolovni red revirja.
      en: Parts of the river are catch-and-release. Check the district rules.
  season:
    sl: Postrvi običajno april–oktober; lipan od junija.
    en: Trout usually April–October; grayling from June.
  beginnerFriendly: false
  difficulty: 2
  links:
    - { label: First Nature – Sava Bohinjka, url: "https://first-nature.com/flyfish/venu-slovenia.php" }
  lastVerified: 2026-10-14

- slug: bohinjsko-jezero
  name: { sl: Bohinjsko jezero, en: Lake Bohinj, de: Wocheiner See, it: Lago di Bohinj }
  type: lake
  region: gorenjska
  water: Bohinjsko jezero
  coords: [46.2820, 13.8780]
  parking: [46.2785, 13.8855]
  description:
    sl: Največje stalno naravno jezero v Sloveniji v Triglavskem narodnem parku. Hladna globoka voda z jezersko zlatovčico in postrvmi.
    en: Slovenia's largest permanent natural lake, inside Triglav National Park. Cold deep water with Arctic char and trout.
  access:
    sl: Parkirišča v Ribčevem Lazu in Ukancu (plačljiva v sezoni). Ribolov le na označenih delih obale.
    en: Parking at Ribčev Laz and Ukanc (paid in season). Fishing only on designated parts of the shore.
  species: [zlatovcica, potocna-postrv]
  techniques: [fly, spin]
  permit:
    kind: club
    note:
      sl: Dovolilnice prodajajo lokalni turistični centri in ribiška družina; posebni pogoji narodnega parka.
      en: Permits sold by local tourist offices and the fishing club; national park rules apply.
  rules:
    notes:
      sl: Narodni park – strogo spoštujte omejitve dostopa in čolnarjenja.
      en: National park – strictly respect access and boating restrictions.
  beginnerFriendly: false
  difficulty: 2
  lastVerified: 2026-10-14

- slug: blejsko-jezero
  name: { sl: Blejsko jezero, en: Lake Bled, de: Bleder See, it: Lago di Bled }
  type: lake
  region: gorenjska
  water: Blejsko jezero
  coords: [46.3630, 14.0900]
  parking: [46.3655, 14.1050]
  description:
    sl: Svetovno znano jezero z rekordnimi krapi in ščukami. Ribolov ob obali z lepim razgledom na otok in grad.
    en: The world-famous lake, known for record carp and pike. Shore fishing with views of the island and castle.
  access:
    sl: Javna parkirišča v Bledu (plačljiva). Peš poti okoli jezera; poleti veliko kopalcev – ribarite zjutraj.
    en: Public paid parking in Bled. Footpath around the lake; many swimmers in summer – fish early morning.
  species: [krap, scuka, smuc, linj, ostriz, som]
  techniques: [carp, spin, float]
  permit:
    kind: club
    note:
      sl: Dnevne dovolilnice pri lokalni ribiški družini in v turističnih centrih.
      en: Day permits from the local fishing club and tourist offices.
  rules:
    notes:
      sl: Omejitve na kopališčih in v času prireditev.
      en: Restrictions near bathing areas and during events.
  beginnerFriendly: true
  difficulty: 1
  lastVerified: 2026-10-14

