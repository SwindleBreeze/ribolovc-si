  description:
    sl: Skalnata obala in pomoli v Ankaranu – šargi, fratrci, orade in brancini, pozimi lignji.
    en: Rocky shore and jetties at Ankaran – white and two-banded sea bream, gilthead and sea bass, squid in winter.
  access:
