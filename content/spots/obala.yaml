# Slovenian coast. Shore fishing needs no permit; boat fishing needs the annual sport
# sea-fishing permit. Fishing is not allowed in the Strunjan and Sečovlje reserves or in
# the Debeli rtič natural monument. More accessible shore spots are mapped by
# SeaFishingSlovenia (linked from each spot).

