    sl: Mrak, noč in svit; ob južnem vetru in rahlo razburkanem morju.
    en: Dusk, night and dawn; with southerly wind and slightly rough sea.
  techniques: [spin, sea-shore]
  rigs: [sea-bass-spinning, sea-bottom-rig]
  tempRange: [10, 20]
  rules:
    minSizeCm: 25
    sourceUrl: https://eur-lex.europa.eu/eli/reg/2006/1967/oj

