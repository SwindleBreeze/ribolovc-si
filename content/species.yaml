# --- Sea -------------------------------------------------------------------------------
- slug: brancin
  name: { sl: Brancin, en: European sea bass, de: Wolfsbarsch, it: Spigola }
  latin: Dicentrarchus labrax
  water: sea
  group: sea
  description:
    sl: Najbolj cenjena riba slovenske obale. Lovi ob kamnitih obalah, valolomih in ustjih rek, najbolje pozimi in ob razburkanem morju.
    en: The most prized fish of the Slovenian coast. Hunts along rocky shores, breakwaters and river mouths, best in winter and in choppy seas.
  habitat:
    sl: Valolomi, skale, pristanišča, ustja Rižane in Dragonje.
    en: Breakwaters, rocks, harbours, the Rižana and Dragonja river mouths.
