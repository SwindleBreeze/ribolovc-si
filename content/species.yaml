# Species encyclopedia. `rigs` refer to guide slugs in content/guides/.
# Freshwater closed seasons and minimum sizes are set per fishing district (revir) in Slovenia,
# so they are not listed here as numbers; the UI always points to the revir rules.
# Sea minimum sizes are the EU Mediterranean minimums (Reg. (EC) No 1967/2006, Annex III).

# --- Salmonids -------------------------------------------------------------------------
- slug: soska-postrv
  name: { sl: Soška postrv, en: Marble trout, de: Marmorierte Forelle, it: Trota marmorata }
  latin: Salmo marmoratus
  water: fresh
  group: salmonid
  description:
    sl: Endemit porečja Soče in simbol slovenskega muharjenja. Zraste lahko čez meter in je vrhunski plenilec hitrih, hladnih rek.
    en: Endemic to the Soča basin and the icon of Slovenian fly fishing. It can grow beyond a metre and is the top predator of fast, cold rivers.
  habitat:
    sl: Globoki tolmuni, tokovi za skalami in podmoli v Soči, Idrijci, Tolminki in Bači.
    en: Deep pools, current seams behind boulders and undercut banks in the Soča, Idrijca, Tolminka and Bača.
  baits:
    sl: Večje muhe ribice in težke nimfe; na nekaterih odsekih tudi suhe muhe ob večernem izletu žuželk.
    en: Large streamers and heavy nymphs; dry flies during evening hatches on some stretches.
  bestMonths: [4, 5, 6, 9, 10]
  bestTime:
    sl: Zgodnje jutro, mrak in oblačni dnevi; po rahlem dvigu in zbistritvi vode.
    en: Early morning, dusk and overcast days; after a small rise in water once it clears again.
  techniques: [fly]
  rigs: [euro-nymphing, dry-fly]
  tempRange: [6, 14]
  rules:
    note:
      sl: Zaščitena avtohtona vrsta. Večina revirjev dovoljuje le muharjenje, pogosto brez zalustnika in z obveznim izpustom.
      en: Protected native species. Most districts allow fly fishing only, often barbless and catch-and-release.
  protected: true

- slug: potocna-postrv
  name: { sl: Potočna postrv, en: Brown trout, de: Bachforelle, it: Trota fario }
  latin: Salmo trutta
  water: fresh
  group: salmonid
  description:
    sl: Najbolj razširjena postrv v slovenskih potokih in rekah. Previdna, a odlično reagira na pravilno predstavljeno muho ali majhno vabo.
    en: The most widespread trout in Slovenian streams and rivers. Wary, but responds well to a well-presented fly or small lure.
  habitat:
    sl: Hladni, s kisikom bogati potoki in reke; zadržuje se za kamni, pod koreninami in v tolmunih.
    en: Cold, oxygen-rich streams and rivers; holds behind stones, under roots and in pools.
  baits:
    sl: Nimfe, suhe muhe, majhne muhe ribice; kjer je dovoljeno vrtenje, majhne vrtilke in voblerji.
    en: Nymphs, dry flies, small streamers; where spinning is allowed, small spinners and minnow lures.
  bestMonths: [4, 5, 6, 9]
  bestTime:
    sl: Jutro in večer, oblačno vreme, rahlo motna voda po dežju.
    en: Morning and evening, cloudy weather, slightly coloured water after rain.
  techniques: [fly, spin]
  rigs: [euro-nymphing, dry-fly, spinning]
  tempRange: [7, 16]

- slug: sarenka
  name: { sl: Šarenka, en: Rainbow trout, de: Regenbogenforelle, it: Trota iridea }
  latin: Oncorhynchus mykiss
  water: fresh
  group: salmonid
  description:
    sl: Tujerodna postrv, ki jo vlagajo v mnoge revirje. Borbena in manj plašna od potočne – odlična za začetnike.
    en: Non-native trout stocked in many districts. Hard-fighting and less shy than brown trout – great for beginners.
  habitat:
    sl: Reke s srednjim tokom, jezera in ribniki za športni ribolov.
    en: Rivers with moderate current, lakes and put-and-take ponds.
  baits:
    sl: Nimfe, muhe ribice, vrtilke, žličke; v ribnikih tudi umetne paste (kjer dovoljeno).
    en: Nymphs, streamers, spinners, small spoons; trout dough in ponds where allowed.
  bestMonths: [3, 4, 5, 6, 9, 10]
  bestTime:
    sl: Ves dan ob oblačnem vremenu, sicer jutro in večer.
    en: All day in cloudy weather, otherwise morning and evening.
  techniques: [fly, spin, float]
  rigs: [euro-nymphing, spinning, float-rig]
  tempRange: [8, 18]

- slug: lipan
  name: { sl: Lipan, en: Grayling, de: Äsche, it: Temolo }
  latin: Thymallus thymallus
  water: fresh
  group: salmonid
  description:
    sl: "\"Gospa reke\" z veliko hrbtno plavutjo. Hrani se pretežno z drobnimi žuželkami, zato je idealna riba za nimfanje in suho muho."
    en: The "lady of the stream" with its sail-like dorsal fin. Feeds mostly on small insects, ideal for nymphing and dry flies.
  habitat:
    sl: Daljši enakomerni tokovi s prodnatim dnom v večjih rekah (Sava, Soča, Krka, Unica, Savinja).
    en: Long even runs over gravel in larger rivers (Sava, Soča, Krka, Unica, Savinja).
  baits:
    sl: Majhne nimfe (vel. 14–18), suhe muhe in muhe v izletu.
    en: Small nymphs (size 14–18), dry flies and emergers.
  bestMonths: [6, 7, 8, 9, 10, 11]
  bestTime:
    sl: Jesen je vrhunec sezone; čez dan, ko je aktivnost žuželk največja.
    en: Autumn is peak season; midday when insect activity peaks.
  techniques: [fly]
  rigs: [euro-nymphing, dry-fly]
  tempRange: [6, 16]
  rules:
    note:
      sl: Lipan ima spomladi dolgo varstveno dobo (drstenje); v mnogih revirjih velja ujemi in spusti.
      en: Grayling has a long spring closed season (spawning); many districts are catch-and-release.

- slug: sulec
  name: { sl: Sulec, en: Huchen (Danube salmon), de: Huchen, it: Salmone del Danubio }
  latin: Hucho hucho
  water: fresh
  group: salmonid
  description:
    sl: Največja postrv na svetu in trofeja življenja. V Sloveniji živi v Savi, Savinji, Krki, Kolpi in Muri.
    en: The largest trout in the world and a fish of a lifetime. In Slovenia it lives in the Sava, Savinja, Krka, Kolpa and Mura.
  habitat:
    sl: Globoki tolmuni in počasnejši tokovi velikih rek, pogosto ob skalah ali podrtih drevesih.
    en: Deep pools and slower runs of large rivers, often near rocks or sunken trees.
  baits:
    sl: Veliki voblerji, gumijaste ribice, pletenice, velike muhe ribice (večinoma nad 10 cm).
    en: Large plugs, soft swimbaits, braided "zopf" lures, big streamers (usually over 10 cm).
  bestMonths: [10, 11, 12, 1, 2]
  bestTime:
    sl: Mrzli zimski dnevi, sneženje, padajoč zračni tlak, zgodnje jutro in pozno popoldne.
    en: Cold winter days, snowfall, falling pressure, early morning and late afternoon.
  techniques: [spin, fly]
  rigs: [huchen]
  tempRange: [2, 9]
  rules:
    note:
      sl: Lov le v zimski sezoni (običajno 1. oktober – 14. februar) in samo v revirjih, ki ga dovolijo. Močno priporočamo izpust.
      en: Only during the winter season (usually 1 October – 14 February) and only in districts that allow it. Release is strongly encouraged.
  protected: true

- slug: zlatovcica
  name: { sl: Jezerska zlatovčica, en: Arctic char, de: Seesaibling, it: Salmerino alpino }
  latin: Salvelinus umbla
  water: fresh
  group: salmonid
  description:
    sl: Hladnoljubna postrvi podobna riba globokih alpskih jezer, kot je Bohinjsko jezero.
    en: A cold-loving salmonid of deep alpine lakes such as Lake Bohinj.
  habitat:
    sl: Globoka, hladna jezerska voda; poleti v globini, spomladi in jeseni bliže obali.
    en: Deep, cold lake water; deep in summer, closer to shore in spring and autumn.
  baits:
    sl: Majhne žličke, voblerji, nimfe in muhe ribice.
    en: Small spoons, minnow lures, nymphs and streamers.
  bestMonths: [5, 6, 9, 10]
  bestTime:
    sl: Jutro in večer, mirni oblačni dnevi.
    en: Morning and evening, calm overcast days.
  techniques: [spin, fly]
  rigs: [spinning]
  tempRange: [4, 12]

- slug: potocna-zlatovcica
  name: { sl: Potočna zlatovčica, en: Brook trout, de: Bachsaibling, it: Salmerino di fonte }
  latin: Salvelinus fontinalis
  water: fresh
  group: salmonid
  description:
    sl: Pisana tujerodna vrsta iz Severne Amerike, ki jo najdemo v hladnih gorskih potokih in nekaterih ribnikih.
    en: A colourful non-native species from North America found in cold mountain brooks and some ponds.
  habitat:
    sl: Zelo hladni potoki in izviri.
    en: Very cold brooks and spring-fed waters.
  baits:
    sl: Nimfe, majhne suhe muhe, mini vrtilke.
    en: Nymphs, small dry flies, mini spinners.
  bestMonths: [5, 6, 9]
  bestTime:
    sl: Jutro in večer.
    en: Morning and evening.
  techniques: [fly, spin]
  rigs: [euro-nymphing, spinning]
  tempRange: [5, 14]

# --- Predators -------------------------------------------------------------------------
- slug: scuka
  name: { sl: Ščuka, en: Pike, de: Hecht, it: Luccio }
  latin: Esox lucius
  water: fresh
  group: predator
  description:
    sl: Napadalna plenilka iz zasede z ostrimi zobmi. Za njen lov potrebujete jekleni ali fluorokarbonski predvrvični del.
    en: An ambush predator with razor-sharp teeth. Always use a wire or heavy fluorocarbon leader.
  habitat:
    sl: Rob trstičja, lokvanji, potopljena drevesa in mirnejši deli rek ter jezer.
    en: Reed edges, lily pads, sunken trees and the calmer parts of rivers and lakes.
  baits:
    sl: Žlice, vrtilke, voblerji, gumijaste ribice, živa ali mrtva riba (kjer dovoljeno).
    en: Spoons, spinners, plugs, soft shads; live or dead fish bait where allowed.
  bestMonths: [5, 9, 10, 11]
  bestTime:
    sl: Jesen je najboljša; oblačni vetrovni dnevi, jutro in pozno popoldne.
    en: Autumn is best; cloudy, windy days, morning and late afternoon.
  techniques: [spin, float]
  rigs: [spinning, float-rig]
  tempRange: [8, 20]

- slug: smuc
  name: { sl: Smuč, en: Zander, de: Zander, it: Lucioperca }
  latin: Sander lucioperca
  water: fresh
  group: predator
  description:
    sl: Plenilec motnejših voda z odličnim vidom v temi. Previdno prijemlje – udarec z vabo mora biti hiter.
    en: A predator of coloured water with excellent low-light vision. Bites carefully, so strike fast.
  habitat:
    sl: Trdo dno, kamnometi, robovi globin v akumulacijah in počasnih rekah (Drava, Sava, Mura, jezera).
    en: Hard bottoms, rip-rap, drop-offs in reservoirs and slow rivers (Drava, Sava, Mura, lakes).
  baits:
    sl: Gumijaste ribice na obteženi glavici, sistem s spodnjo utežjo, ozki voblerji, ribica na dnu.
    en: Soft baits on jig heads, drop-shot, slim plugs, dead fish on the bottom.
  bestMonths: [6, 9, 10, 11]
  bestTime:
    sl: Mrak in noč, oblačni dnevi, rahlo motna voda.
    en: Dusk and night, overcast days, slightly coloured water.
  techniques: [spin, bottom]
  rigs: [drop-shot, spinning]
  tempRange: [10, 22]

- slug: ostriz
  name: { sl: Ostriž, en: Perch, de: Flussbarsch, it: Persico reale }
  latin: Perca fluviatilis
  water: fresh
  group: predator
  description:
    sl: Črtasti jatni plenilec – idealen za začetnike, saj pogosto in rad prijemlje.
    en: A striped schooling predator – perfect for beginners because it bites often.
  habitat:
    sl: Pomoli, potopljene ovire, rob trstičja, jezera in počasne reke.
    en: Jetties, sunken structure, reed edges, lakes and slow rivers.
  baits:
    sl: Črvi, majhne vrtilke, majhne gumijaste vabe, sistem s spodnjo utežjo.
    en: Worms, small spinners, micro soft baits, drop-shot.
  bestMonths: [5, 6, 7, 8, 9, 10]
  bestTime:
    sl: Čez dan; jate se pogosto zberejo ob pomolih.
    en: During the day; schools often gather around jetties.
  techniques: [spin, float]
  rigs: [drop-shot, float-rig, spinning]
  tempRange: [12, 24]

- slug: som
  name: { sl: Som, en: Wels catfish, de: Wels, it: Siluro }
  latin: Silurus glanis
  water: fresh
  group: catfish
  description:
    sl: Največja sladkovodna riba v Sloveniji, ki lahko preseže 2 metra. Potrebuje močno opremo.
    en: The largest freshwater fish in Slovenia, which can exceed 2 metres. Requires heavy tackle.
  habitat:
    sl: Globoke luknje, podrta drevesa in mirni deli velikih rek ter akumulacij (Drava, Sava, Mura, Ptujsko jezero).
    en: Deep holes, fallen trees and calm stretches of large rivers and reservoirs (Drava, Sava, Mura, Lake Ptuj).
  baits:
    sl: Snopi rosnic, pelete za soma, kosi ribe, velike gumijaste vabe; s čolna tudi lov s klonkom.
    en: Bunches of dew worms, catfish pellets, fish pieces, large soft baits; clonking from a boat.
  bestMonths: [5, 6, 7, 8, 9]
  bestTime:
    sl: Topla noč, pred nevihto, ob rahlem dvigu vode.
    en: Warm nights, before a thunderstorm, on a small rise in water.
  techniques: [bottom, spin]
  rigs: [feeder-rig]
  tempRange: [18, 28]

- slug: bolen
  name: { sl: Bolen, en: Asp, de: Rapfen, it: Aspio }
  latin: Leuciscus aspius
  water: fresh
  group: predator
  description:
    sl: Hiter plenilec, ki lovi ribice na površini – njegovi napadi so vidni kot pljuski.
    en: A fast predator that hunts small fish at the surface – you can see its splashes.
  habitat:
    sl: Hitri tokovi pod jezovi, sotočja in odprta voda v Dravi, Muri in Savi.
    en: Fast currents below weirs, confluences and open water in the Drava, Mura and Sava.
  baits:
    sl: Daljnometne žlice, ozki voblerji, površinske vabe; hitro vodenje.
    en: Long-casting spoons, slim plugs, surface lures; fast retrieve.
  bestMonths: [6, 7, 8, 9]
  bestTime:
    sl: Jutro in večer, ko lovi na površini.
    en: Morning and evening when it hunts at the surface.
  techniques: [spin]
  rigs: [spinning]
  tempRange: [14, 24]

- slug: soncni-ostriz
  name: { sl: Sončni ostriž, en: Pumpkinseed, de: Sonnenbarsch, it: Persico sole }
  latin: Lepomis gibbosus
  water: fresh
  group: predator
  description:
    sl: Majhna invazivna tujerodna riba. Pogosto prvi ulov otrok – rada prijemlje na črva.
    en: A small invasive non-native fish. Often a child's first catch – loves a worm.
  habitat:
    sl: Plitvine, pomoli in obrežje toplih jezer in mrtvic.
    en: Shallows, jetties and margins of warm lakes and backwaters.
  baits:
    sl: Črvi, ličinke, koščki kruha.
    en: Worms, maggots, bits of bread.
  bestMonths: [5, 6, 7, 8, 9]
  bestTime:
    sl: Čez dan v toplem vremenu.
    en: During the day in warm weather.
  techniques: [float]
  rigs: [float-rig]
  tempRange: [16, 28]

# --- Cyprinids and other coarse fish ----------------------------------------------------
- slug: krap
  name: { sl: Krap, en: Carp, de: Karpfen, it: Carpa }
  latin: Cyprinus carpio
  water: fresh
  group: cyprinid
  description:
    sl: Najbolj priljubljena riba za krapolov. Močan, previden in lahko presega 20 kg.
    en: The favourite target of carp anglers. Powerful, cautious and can exceed 20 kg.
  habitat:
    sl: Jezera, ribniki, akumulacije in počasne reke; ob trstičju, lokvanjih in robovih.
    en: Lakes, ponds, reservoirs and slow rivers; near reeds, lily pads and drop-offs.
  baits:
    sl: Boiliji, koruza, pelete, tigrov orešček (pripravljen), kruh.
    en: Boilies, sweetcorn, pellets, prepared tiger nuts, bread.
  bestMonths: [4, 5, 6, 9, 10]
  bestTime:
    sl: Jutro in noč; topli jugozahodni veter na plitvinah.
    en: Morning and night; warm south-westerly wind blowing into the shallows.
  techniques: [carp, feeder, float]
  rigs: [hair-rig, feeder-rig, float-rig]
  tempRange: [14, 26]

- slug: amur
  name: { sl: Amur, en: Grass carp, de: Graskarpfen, it: Carpa erbivora }
  latin: Ctenopharyngodon idella
  water: fresh
  group: cyprinid
  description:
    sl: Rastlinojeda riba, vložena v mnoga jezera. Izjemno močna in hitra v boju.
    en: A herbivorous fish stocked in many lakes. Extremely strong and fast when hooked.
  habitat:
    sl: Plitvine z vodnim rastlinjem v toplih jezerih.
    en: Weedy shallows in warm lakes.
  baits:
    sl: Koruza, kruh, trava/detelja, boiliji.
    en: Sweetcorn, bread, grass/clover, boilies.
  bestMonths: [6, 7, 8, 9]
  bestTime:
    sl: Vroči poletni dnevi, popoldne.
    en: Hot summer days, afternoon.
  techniques: [carp, float]
  rigs: [hair-rig, float-rig]
  tempRange: [18, 28]

- slug: linj
  name: { sl: Linj, en: Tench, de: Schleie, it: Tinca }
  latin: Tinca tinca
  water: fresh
  group: cyprinid
  description:
    sl: Zelenkasta riba z rdečimi očmi, ki ljubi mirne, zaraščene vode.
    en: An olive-green fish with red eyes that loves still, weedy water.
  habitat:
    sl: Mirne, blatne in zaraščene vode, ob lokvanjih.
    en: Still, muddy, weedy water next to lily pads.
  baits:
    sl: Črvi, ličinke, koruza.
    en: Worms, maggots, sweetcorn.
  bestMonths: [5, 6, 7]
  bestTime:
    sl: Zgodnje jutro.
    en: Early morning.
  techniques: [float, feeder]
  rigs: [float-rig, feeder-rig]
  tempRange: [15, 25]

- slug: ploscic
  name: { sl: Ploščič, en: Common bream, de: Brachse, it: Abramide }
  latin: Abramis brama
  water: fresh
  group: cyprinid
  description:
    sl: Visokohrbta jatna riba – ko najdete jato, sledi ulov za ulovom.
    en: A deep-bodied schooling fish – find the shoal and the bites keep coming.
  habitat:
    sl: Globlji mirni deli jezer, akumulacij in počasnih rek.
    en: Deeper calm water in lakes, reservoirs and slow rivers.
  baits:
    sl: Ličinke, črvi, koruza s krmilnim košem in vabilno mešanico.
    en: Maggots, worms, corn on a feeder with groundbait.
  bestMonths: [5, 6, 7, 8, 9]
  bestTime:
    sl: Večer in noč.
    en: Evening and night.
  techniques: [feeder, float]
  rigs: [feeder-rig, float-rig]
  tempRange: [14, 24]

- slug: klen
  name: { sl: Klen, en: Chub, de: Döbel, it: Cavedano }
  latin: Squalius cephalus
  water: fresh
  group: cyprinid
  description:
    sl: Vsejed, ki ga najdemo skoraj povsod. Prijemlje na vse – od kruha do vrtilk in muh.
    en: An omnivore found almost everywhere. Takes everything from bread to spinners and flies.
  habitat:
    sl: Reke vseh velikosti, pod drevesi, ob mostovih in v tokovih.
    en: Rivers of every size, under trees, by bridges and in runs.
  baits:
    sl: Kruh, sir, češnje, ličinke; majhni voblerji, vrtilke, suhe muhe (kobilice).
    en: Bread, cheese, cherries, maggots; small plugs, spinners, dry flies (hoppers).
  bestMonths: [5, 6, 7, 8, 9, 10]
  bestTime:
    sl: Ves dan poleti; ob padanju žuželk ali sadja v vodo.
    en: All day in summer; when insects or fruit fall into the water.
  techniques: [float, spin, fly, feeder]
  rigs: [float-rig, spinning, dry-fly]
  tempRange: [10, 24]

- slug: mrena
  name: { sl: Mrena, en: Barbel, de: Barbe, it: Barbo }
  latin: Barbus barbus
  water: fresh
  group: cyprinid
  description:
    sl: Močna pridnena riba hitrejših rek. Boj z mreno v toku je nepozaben.
    en: A powerful bottom-feeder of faster rivers. A barbel fight in current is unforgettable.
  habitat:
    sl: Prodnato dno in hitri tokovi Kolpe, Krke, Save, Savinje in Drave.
    en: Gravel beds and fast runs of the Kolpa, Krka, Sava, Savinja and Drava.
  baits:
    sl: Ličinke, črvi, sir, pelete s krmilnim košem.
    en: Maggots, worms, cheese, pellets on a feeder.
  bestMonths: [6, 7, 8, 9]
  bestTime:
    sl: Večer in noč, ob rahlo povišani vodi.
    en: Evening and night, on slightly raised water.
  techniques: [feeder, bottom]
  rigs: [feeder-rig]
  tempRange: [12, 22]

- slug: podust
  name: { sl: Podust, en: Nase, de: Nase, it: Savetta }
  latin: Chondrostoma nasus
  water: fresh
  group: cyprinid
  description:
    sl: Jatna rečna riba, ki strga alge s kamnov. Pogosta v Kolpi in Savinji.
    en: A schooling river fish that grazes algae off stones. Common in the Kolpa and Savinja.
  habitat:
    sl: Prodnati tokovi srednjih in večjih rek.
    en: Gravel runs of medium and large rivers.
  baits:
    sl: Ličinke, drobne nimfe.
    en: Maggots, small nymphs.
  bestMonths: [6, 7, 8, 9]
  bestTime:
    sl: Čez dan.
    en: During the day.
  techniques: [float, fly]
  rigs: [float-rig, euro-nymphing]
  tempRange: [12, 22]

- slug: rdeceoka
  name: { sl: Rdečeoka, en: Roach, de: Rotauge, it: Rutilo }
  latin: Rutilus rutilus
  water: fresh
  group: cyprinid
  description:
    sl: Majhna srebrna riba z rdečimi očmi, idealna za učenje ribolova s plovcem.
    en: A small silver fish with red eyes, ideal for learning float fishing.
  habitat:
    sl: Jezera, mrtvice in počasne reke.
    en: Lakes, backwaters and slow rivers.
  baits:
    sl: Ličinke, kruh, drobne ličinke.
    en: Maggots, bread, pinkies.
  bestMonths: [4, 5, 6, 9, 10]
  bestTime:
    sl: Čez dan.
    en: During the day.
  techniques: [float, feeder]
  rigs: [float-rig, feeder-rig]
  tempRange: [10, 22]

- slug: rdeceperka
  name: { sl: Rdečeperka, en: Rudd, de: Rotfeder, it: Scardola }
  latin: Scardinius erythrophthalmus
  water: fresh
  group: cyprinid
  description:
    sl: Zlatkasta riba z rdečimi plavutmi, ki se hrani blizu površine.
